name: Mirror upstream spray release

on:
  schedule:
    - cron: '0 4 * * *'        # daily 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream latest tag
        id: up
        run: |
          tag=$(curl -sSL https://api.github.com/repos/chainreactors/spray/releases/latest | jq -r .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream tag = $tag"

      - name: Read currently-mirrored tag
        id: cur
        run: |
          if [ -f artifacts/spray.version ]; then
            cur=$(cat artifacts/spray.version | tr -d '[:space:]')
          else
            cur="none"
          fi
          echo "tag=$cur" >> "$GITHUB_OUTPUT"
          echo "currently mirrored = $cur"

      - name: Skip if up to date
        id: gate
        run: |
          if [ "${{ steps.up.outputs.tag }}" = "${{ steps.cur.outputs.tag }}" ]; then
            echo "needs_mirror=false" >> "$GITHUB_OUTPUT"
            echo "already up to date"
          else
            echo "needs_mirror=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream binaries
        if: steps.gate.outputs.needs_mirror == 'true'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          mkdir -p artifacts
          # Linux only — that's all our worker fleet needs.  amd64 first
          # (most likely consumer), arm64 + 386 best-effort.
          for asset in spray_linux_amd64 spray_linux_arm64 spray_linux_386 spray_checksums.txt; do
            url="https://github.com/chainreactors/spray/releases/download/${TAG}/${asset}"
            curl -fSL --retry 3 --retry-delay 5 -o "artifacts/${asset}" "$url" || \
              echo "skip ${asset}"
          done
          echo "$TAG" > artifacts/spray.version
          ls -la artifacts/

      - name: Commit + push to main (JSDelivr-serveable path)
        if: steps.gate.outputs.needs_mirror == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add artifacts/spray_linux_* artifacts/spray_checksums.txt artifacts/spray.version
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(sync): mirror spray ${{ steps.up.outputs.tag }} [skip ci]"
          # Retry with rebase — sister workflow may have pushed in parallel,
          # 9MB binaries occasionally hiccup mid-push too.
          for i in 1 2 3 4 5; do
            git push origin main && break
            echo "push rejected (attempt $i), pulling + rebasing..."
            git pull --rebase origin main
            sleep $((i * 2))
          done

      - name: Also create gh release (for direct download fallback)
        if: steps.gate.outputs.needs_mirror == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          sleep 2
          gh release create "$TAG" \
            artifacts/spray_linux_amd64 \
            artifacts/spray_linux_arm64 \
            artifacts/spray_linux_386 \
            artifacts/spray_checksums.txt \
            --repo "${{ github.repository }}" \
            --title "spray $TAG (mirrored)" \
            --notes "Mirror of [chainreactors/spray $TAG](https://github.com/chainreactors/spray/releases/tag/$TAG). Primary consumer URL via JSDelivr: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/artifacts/spray_linux_amd64"

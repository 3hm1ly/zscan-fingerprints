name: Sync FingerprintHub → fingers YAML overlay

on:
  schedule:
    - cron: '0 4 * * 1'        # Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # need full history so we can push back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Pull FingerprintHub upstream
        run: |
          curl -fSL --retry 3 --retry-delay 5 \
            -o web_fingerprint_v4.json \
            https://raw.githubusercontent.com/0x727/FingerprintHub/main/web_fingerprint_v4.json
          echo "size: $(wc -c < web_fingerprint_v4.json) bytes"

      - name: Convert → fingers YAML
        run: |
          mkdir -p artifacts
          python scripts/fph_to_fingers.py web_fingerprint_v4.json artifacts/finger_hub_overlay.yaml
          # also write a metadata stamp so CDN consumers can sanity-check freshness
          cat > artifacts/finger_hub_overlay.meta.json <<EOF
          {
            "synced_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "upstream_commit": "$(curl -sSL https://api.github.com/repos/0x727/FingerprintHub/commits/main | jq -r .sha)",
            "yaml_sha256": "$(sha256sum artifacts/finger_hub_overlay.yaml | cut -d' ' -f1)",
            "yaml_size": $(wc -c < artifacts/finger_hub_overlay.yaml)
          }
          EOF
          cat artifacts/finger_hub_overlay.meta.json

      - name: Commit + push to main (so JSDelivr can serve it)
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add artifacts/finger_hub_overlay.yaml artifacts/finger_hub_overlay.meta.json
          if git diff --cached --quiet; then
            echo "no changes (FingerprintHub upstream identical to last sync)"
            exit 0
          fi
          git commit -m "chore(sync): refresh FingerprintHub overlay $(date -u +'%Y-%m-%d') [skip ci]"
          # Retry with rebase — sister workflow may have pushed in parallel
          for i in 1 2 3 4 5; do
            git push origin main && break
            echo "push rejected (attempt $i), pulling + rebasing..."
            git pull --rebase origin main
            sleep $((i * 2))
          done

      - name: Also publish dated release (for direct gh release download)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fp-$(date -u +'%Y%m%d')"
          gh release delete "$tag" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          sleep 2
          tar czf finger_hub_overlay.tar.gz -C artifacts finger_hub_overlay.yaml finger_hub_overlay.meta.json
          gh release create "$tag" \
            artifacts/finger_hub_overlay.yaml \
            artifacts/finger_hub_overlay.meta.json \
            finger_hub_overlay.tar.gz \
            --repo "${{ github.repository }}" \
            --title "FingerprintHub overlay $tag" \
            --notes "Synced from 0x727/FingerprintHub. JSDelivr CDN URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/artifacts/finger_hub_overlay.yaml"
